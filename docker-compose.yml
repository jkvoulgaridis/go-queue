version: '3.8'

x-gqueue-common: &common-img
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  master:
    <<: *common-img
    container_name: master
    environment:
      - NODE_TYPE=master
      - BROKER_ADDR=:18018
    ports:
      - "18018:18018"
    command: 
      - /app/bin/broker

  worker:
    <<: *common-img
    depends_on:
      - master
    environment:
      - NODE_TYPE=worker
      - BROKER_ADDR=master:18018
      - WORKER_CONCURRENCY=100
      - WORKER_POLL_MS=1000
    command:
      - /app/bin/worker
    deploy:
      replicas: 3